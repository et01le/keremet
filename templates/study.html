{% extends "base_page.html" %}

{% block pagetitle %}
Изучать лексику
{% endblock %}

{% block content %}
<button onclick="location.reload()" class="btn btn-primary position-fixed mt-4 end-0 m-4 shadow">
  <i class="bi bi-arrow-repeat"></i> Обновить
</button>
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front d-flex align-items-center justify-content-center p-4">
                <p class="display-6 mb-0">{{ random_term.term }}</p>
            </div>
            <div class="flip-card-back d-flex align-items-center justify-content-center p-4">
                <p class="display-6 mb-0">{{ random_term.translation }}</p>
            </div>
        </div>
    </div>
</div>
<a href="{% url 'all' %}" class="btn btn-primary position-fixed bottom-0 end-0 m-4">
    <i class="bi bi-arrow-right"></i> Все термины
</a>
{% endblock %}
