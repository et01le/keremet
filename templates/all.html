{% extends "base_page.html" %}

{% block pagetitle %}
Все термины
{% endblock %}

{% block content %}
<div class="container px-4 py-5">
    <div class="table-responsive">
        <table class="table table-striped table-sm">
          <thead>
            <tr>
              <th scope="col" class="py-3">Термин</th>
              <th scope="col" class="py-3">Перевод</th>
            </tr>
          </thead>
          <tbody>
            {% for term in terms %}
            <tr>
                <td class="py-3">{{ term.term }}</td>
                <td class="py-3">{{ term.translation }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
</div>
{% endblock %}
